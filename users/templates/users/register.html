{% extends "base.html" %}

{% block title %}
Registrarse | EventLen
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <div class="card">
            <div class="card-body">

                <h1 class="h3 mb-4">
                    Crear cuenta
                </h1>

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Registrarse
                    </button>

                </form>

                <p class="mt-3 mb-0">
                    ¿Ya tienes una cuenta?

                    <a href="{% url 'login' %}">
                        Iniciar sesión
                    </a>
                </p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
