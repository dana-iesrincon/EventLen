{% extends "base.html" %}

{% block title %}
Iniciar sesión | EventLen
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">

        <div class="card">
            <div class="card-body">

                <h1 class="h3 mb-4">
                    Iniciar sesión
                </h1>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Usuario
                        </label>

                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Contraseña
                        </label>

                        {{ form.password }}
                    </div>

                    {% if next %}
                        <input
                            type="hidden"
                            name="next"
                            value="{{ next }}"
                        >
                    {% endif %}

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Iniciar sesión
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
